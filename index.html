  <head>
    <meta charset="UTF-8" />

    <title>EG-Finance Fx COT Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Outfit', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
                midnight: '#0f172a', /* Changed to Slate 900 */
                'electric-blue': '#3b82f6',
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar for dark theme tables */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(59, 130, 246, 0.5); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(59, 130, 246, 0.8); 
      }

      /* Animations */
      @keyframes popUpSlow {
        0% { 
          opacity: 0; 
          transform: translateY(20px); 
        }
        100% { 
          opacity: 1; 
          transform: none; 
          filter: none;
        }
      }
      
      .animate-fade-in {
        animation: popUpSlow 1.0s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      /* Ticker Animation */
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      
      .animate-marquee {
        animation: marquee 160s linear infinite;
        width: max-content;
        display: flex;
      }
      
      .animate-marquee:hover {
        animation-play-state: paused;
      }

      /* Twister Flip Animation */
      @keyframes twisterFlip {
        0% { transform: rotate3d(-1, 1, 0, 0deg) scale(1); }
        50% { transform: rotate3d(-1, 1, 0, 90deg) scale(0.3); }
        100% { transform: rotate3d(-1, 1, 0, 180deg) scale(1); }
      }
      @keyframes twisterFlipBack {
        0% { transform: rotate3d(-1, 1, 0, 180deg) scale(1); }
        50% { transform: rotate3d(-1, 1, 0, 90deg) scale(0.3); }
        100% { transform: rotate3d(-1, 1, 0, 0deg) scale(1); }
      }
      .animate-twister-forward {
        animation: twisterFlip 1s ease-in-out forwards;
      }
      .animate-twister-backward {
        animation: twisterFlipBack 1s ease-in-out forwards;
      }

      /* Increased delays for slower, distinct staggering */
      .delay-100 { animation-delay: 200ms; }
      .delay-200 { animation-delay: 400ms; }
      .delay-300 { animation-delay: 600ms; }
      .delay-500 { animation-delay: 800ms; }

      body {
        margin: 0;
        padding: 0;
      }
    </style>

}
</script>
